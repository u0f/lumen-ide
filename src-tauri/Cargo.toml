[package]
name = "lumen-ide"
version = "1.0.0"
description = "A lightweight desktop IDE with Git and a real terminal"
license = "MIT"
repository = "https://github.com/u0f/lumen-ide"
edition = "2021"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
portable-pty = "0.9"
ignore = "0.4"
regex = "1"
trash = "5"
base64 = "0.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
